rf_model:
  type : "RandomForestClassifier"
  random_state: 42
  n_estimators: 200 
  max_depth: 5
  min_samples_split: 15
  bootstrap: True
  class_weight: 'balanced_subsample'

lr_model: 
  type: "LogisticRegression"
  random_state: 42
  max_iter: 150
  C : 0.01

gb_model: 
  type: "GradientBoostingClassifier"
  loss: "log_loss"
  learning_rate: 0.1
  subsample: 1.0           # Fraction of samples used for fitting individual base learners (<1.0 leads to Stochastic Gradient Boosting)
  max_features: 'None'
  n_estimators: 50
  max_depth: 5
  min_samples_split: 10
  min_samples_leaf: 1
  random_state: 42